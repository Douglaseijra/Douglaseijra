  <rect x="536" y="78" width="72" height="34" rx="17" fill="url(#pill)" stroke="#FFFFFF" stroke-opacity="0.70" stroke-width="1"/>
  <rect x="537" y="79" width="70" height="1.5" rx="1" fill="#FFFFFF" fill-opacity="0.80"/>
  <circle cx="555" cy="95" r="5" fill="#F05138"/>
  <text x="566" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#1A1A1A">Swift</text>
</g>

<!-- p6: Kotlin x=616 w=80 -->
<g class="p6">
