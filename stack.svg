<svg width="860" height="244" viewBox="0 0 860 244" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#F3F3F3"/>
    <stop offset="100%" stop-color="#C8C8C8"/>
  </radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.84"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.52"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
  </linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.66"/>
  </linearGradient>
  <filter id="drop" x="-5%" y="-10%" width="110%" height="130%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#141414" flood-opacity="0.08"/>
  </filter>
  <style>
    @keyframes slideIn {
      from { opacity:0; transform:translateX(-12px); }
      to   { opacity:1; transform:translateX(0); }
    }
    @keyframes fadeIn {
      from { opacity:0; }
      to   { opacity:1; }
    }
    .lbl  { opacity:0; animation: fadeIn .5s ease-out .05s forwards; }
    .lbl2 { opacity:0; animation: fadeIn .5s ease-out .60s forwards; }
    .div1 { opacity:0; animation: fadeIn .4s ease-out .56s forwards; }
    .p0  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .10s forwards; }
    .p1  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .18s forwards; }
    .p2  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .26s forwards; }
    .p3  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .34s forwards; }
    .p4  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .42s forwards; }
    .p5  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .50s forwards; }
    .p6  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .58s forwards; }
    .p7  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .66s forwards; }
    .p8  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .74s forwards; }
    .p9  { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .82s forwards; }
    .p10 { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .90s forwards; }
    .p11 { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .98s forwards; }
    .p12 { opacity:0; animation: slideIn .45s cubic-bezier(.22,1,.36,1) 1.06s forwards; }
  </style>
</defs>

<!-- Background -->
<rect width="860" height="244" fill="url(#bg)"/>

<!-- Glass card -->
<rect x="28" y="28" width="804" height="188" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="1" filter="url(#drop)"/>

<!-- Top sheen -->
<rect x="29" y="29" width="802" height="94" rx="18" fill="url(#sheen)"/>

<!-- LANGUAGES label -->
<text class="lbl" x="60" y="70"
  font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
  font-size="11" font-weight="500" letter-spacing="0.05em" fill="#8A8A87">LANGUAGES</text>

<!-- Language pills  y_top=78  cy=95  text_y=100 -->

<!-- p0: JavaScript x=60 w=112 -->
<g class="p0">
  <rect x="60" y="78" width="112" height="34" rx="17" fill="url(#pill)" stroke="#FFFFFF" stroke-opacity="0.70" stroke-width="1"/>
  <rect x="61" y="79" width="110" height="1.5" rx="1" fill="#FFFFFF" fill-opacity="0.80"/>
  <circle cx="79" cy="95" r="5" fill="#E68343"/>
  <text x="90" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#1A1A1A">JavaScript</text>
</g>

<!-- p1: TypeScript x=180 w=110 -->
