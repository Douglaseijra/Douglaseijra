  <rect x="299" y="79" width="84" height="1.5" rx="1" fill="#FFFFFF" fill-opacity="0.80"/>
  <circle cx="317" cy="95" r="5" fill="#4A4A4A"/>
  <text x="328" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#1A1A1A">Python</text>
