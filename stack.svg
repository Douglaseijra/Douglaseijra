  <circle cx="477" cy="95" r="5" fill="#B86A2E"/>
  <text x="488" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#1A1A1A">Rust</text>
</g>

