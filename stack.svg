<!-- Divider -->
<rect class="div1" x="60" y="128" width="740" height="1" fill="#E7E6E2"/>

<!-- TOOLS label -->
<text class="lbl2" x="60" y="148"
  font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
  font-size="11" font-weight="500" letter-spacing="0.05em" fill="#8A8A87">TOOLS</text>

