<svg width="860" height="460" viewBox="0 0 860 460" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#F3F3F3"/>
    <stop offset="100%" stop-color="#C8C8C8"/>
  </radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.50"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
  </linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.66"/>
  </linearGradient>
  <filter id="drop" x="-5%" y="-10%" width="110%" height="125%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#141414" flood-opacity="0.08"/>
  </filter>
</defs>

